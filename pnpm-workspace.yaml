packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true

# Security floors only. Each entry stays inside the major its dependents
# declare: an override that crosses a major swaps in an incompatible API and
# breaks the tool at runtime rather than at install time.
overrides:
  brace-expansion: ">=5.0.6"
  minimatch@1>brace-expansion: "^1.1.12"
  minimatch@3>brace-expansion: "^1.1.12"
  minimatch@5>brace-expansion: "^2.1.2"
  minimatch@6>brace-expansion: "^2.1.2"
  minimatch@7>brace-expansion: "^2.1.2"
  minimatch@8>brace-expansion: "^2.1.2"
  minimatch@9>brace-expansion: "^2.1.2"
  esbuild: ">=0.28.1"
  fast-uri: ">=4.0.0"
  ajv>fast-uri: "^3.1.0"
  form-data: ">=4.0.6"
  js-yaml: "^4.1.2"
  read-yaml-file>js-yaml: "^3.14.1"
  linkify-it: "^5.0.2"
  markdown-it: ">=14.2.0"
  qs: ">=6.15.2"
  tmp: ">=0.2.6"
  undici: ">=7.28.0"
  cheerio>undici: "^7.28.0"
  uuid: ">=11.1.1"
  vite: ">=8.0.16"
